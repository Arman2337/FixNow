name: fixnow-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixnow_postgres
    environment:
      POSTGRES_USER: fixnow
      POSTGRES_PASSWORD: replace-me
      POSTGRES_DB: fixnow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixnow -d fixnow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fixnow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
