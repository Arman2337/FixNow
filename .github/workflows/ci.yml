name: CI

# The `schema` job is the point of this file. A migration once dropped every
# bookings foreign key, every value-domain CHECK and several `version` defaults
# without restoring them, and nothing failed - because no job ever built a
# database from scratch, and no test asserted the constraints still existed.
# `schema` is the job that would have caught it.

on:
  push:
    # Every branch, not just main. The repository has no branch protection, so a
    # push-triggered run is the only automatic signal a change gets before
    # anyone remembers to open a pull request. Narrow this to [main, master] once
    # PRs are the enforced path.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixnow_ci

jobs:
  schema:
    name: Schema (build from migrations, then verify)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixnow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build a database from every migration and verify it
        # Creates a throwaway database, applies all migrations in order, then
        # asserts the invariants (foreign keys, CHECKs, version defaults, money
        # uniqueness) and proves the database refuses bad data.
        env:
          SCHEMA_SCRATCH_DB: fixnow_schema_gate
        run: npm run schema:verify:fresh

      - name: Re-run the gate against the built schema
        # Proves the gate itself is repeatable, and catches an environment
        # where a migration only half-applied.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixnow_schema_gate
        run: npm run schema:verify

  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixnow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint "src/**/*.ts" "scripts/**/*.ts"

      # The deploy definition and the code must agree on every variable name.
      # render.yaml once set AI_PROVIDER_API_KEY, which exists nowhere in the
      # backend, so the secret was collected with no effect.
      - name: Verify render.yaml matches the code's configuration
        run: npm run deploy:verify-env

      - name: Test
        run: npx jest --ci

  integration:
    name: Backend integration (real PostgreSQL)
    runs-on: ubuntu-latest

    # The suite these specs live in had never been executed by anyone. It needs a
    # dedicated, disposable database: the specs TRUNCATE. Every spec refuses to
    # run unless the target is loopback, port 55432, role `fixnow_test`, database
    # `fixnow_test` - which is why the service below is published on 55432 rather
    # than the 5432 the other jobs use.
    #
    # The first run found three things no other gate could see: a query joining
    # a TypeORM relation that does not exist (every booking list 500'd), a
    # pagination off-by-one, and harnesses whose hand-copied entity lists had
    # rotted. Unit tests mock all three away.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixnow_test
          POSTGRES_PASSWORD: fixnow_test
          POSTGRES_DB: fixnow_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://fixnow_test:fixnow_test@localhost:55432/fixnow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the schema from every migration
        # The specs assert against constraints and triggers that only exist if
        # migrations built them. `synchronize` is never enabled, so an empty
        # database here means the migrations, not the entity metadata.
        env:
          DATABASE_URL: postgresql://fixnow_test:fixnow_test@localhost:55432/fixnow_test
        run: npm run migration:run

      - name: Integration test
        run: npm run test:integration

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Installs the Flutter SDK named by the `flutter-version` below. Without
      # this the 389 mobile tests only ever ran on one machine, so a change that
      # broke the app would not be caught until after merge.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub
