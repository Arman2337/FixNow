name: fixnow_mobile
description: FixNow customer and provider mobile application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  file_picker: 11.0.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_secure_storage: 10.0.0
  geocoding: ^5.0.0
  geolocator: 14.0.2
  http: 1.6.0
  http_parser: 4.1.2
  image_picker: ^1.1.2
  latlong2: ^0.10.1
  permission_handler: 11.4.0
  record: ^5.2.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true

  # ---------------------------------------------------------------------------
  # Bundled brand fonts (Playfair Display + Inter) — TEMPORARILY DISABLED.
  #
  # The declarations below are correct and ready, but Flutter refuses to compile
  # when it can't find a declared .ttf asset, and the binaries are not committed
  # yet. Until the five .ttf files are added to mobile/assets/fonts/ (see the
  # README there for exact filenames + OFL download sources), this block stays
  # commented out so the app builds. In the meantime it runs on the fallback
  # faces declared in app_typography.dart (Georgia/serif for headings,
  # Roboto/sans for body).
  #
  # TO ENABLE: drop the 5 .ttf files into mobile/assets/fonts/, then uncomment
  # this block. Family strings MUST match app_typography.dart exactly
  # ('Playfair Display', 'Inter').
  # ---------------------------------------------------------------------------
  # fonts:
  #   - family: Playfair Display
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/PlayfairDisplay-Bold.ttf
  #         weight: 700
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
