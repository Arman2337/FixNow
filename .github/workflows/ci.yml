name: CI

# The `schema` job is the point of this file. A migration once dropped every
# bookings foreign key, every value-domain CHECK and several `version` defaults
# without restoring them, and nothing failed - because no job ever built a
# database from scratch, and no test asserted the constraints still existed.
# `schema` is the job that would have caught it.

on:
  push:
    # Every branch, not just main. The repository has no branch protection, so a
    # push-triggered run is the only automatic signal a change gets before
    # anyone remembers to open a pull request. Narrow this to [main, master] once
    # PRs are the enforced path.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixnow_ci

jobs:
  schema:
    name: Schema (build from migrations, then verify)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixnow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build a database from every migration and verify it
        # Creates a throwaway database, applies all migrations in order, then
        # asserts the invariants (foreign keys, CHECKs, version defaults, money
        # uniqueness) and proves the database refuses bad data.
        env:
          SCHEMA_SCRATCH_DB: fixnow_schema_gate
        run: npm run schema:verify:fresh

      - name: Re-run the gate against the built schema
        # Proves the gate itself is repeatable, and catches an environment
        # where a migration only half-applied.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixnow_schema_gate
        run: npm run schema:verify

  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixnow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint "src/**/*.ts" "scripts/**/*.ts"

      # The deploy definition and the code must agree on every variable name.
      # render.yaml once set AI_PROVIDER_API_KEY, which exists nowhere in the
      # backend, so the secret was collected with no effect.
      - name: Verify render.yaml matches the code's configuration
        run: npm run deploy:verify-env

      - name: Test
        run: npx jest --ci

  integration:
    name: Backend integration (real PostgreSQL)
    runs-on: ubuntu-latest

    # The suite these specs live in had never been executed by anyone. It needs a
    # dedicated, disposable database: the specs TRUNCATE. Every spec refuses to
    # run unless the target is loopback, port 55432, role `fixnow_test`, database
    # `fixnow_test` - which is why the service below is published on 55432 rather
    # than the 5432 the other jobs use.
    #
    # The first run found three things no other gate could see: a query joining
    # a TypeORM relation that does not exist (every booking list 500'd), a
    # pagination off-by-one, and harnesses whose hand-copied entity lists had
    # rotted. Unit tests mock all three away.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixnow_test
          POSTGRES_PASSWORD: fixnow_test
          POSTGRES_DB: fixnow_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://fixnow_test:fixnow_test@localhost:55432/fixnow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the schema from every migration
        # The specs assert against constraints and triggers that only exist if
        # migrations built them. `synchronize` is never enabled, so an empty
        # database here means the migrations, not the entity metadata.
        env:
          DATABASE_URL: postgresql://fixnow_test:fixnow_test@localhost:55432/fixnow_test
        run: npm run migration:run

      - name: Integration test
        run: npm run test:integration

  admin:
    name: Admin (lint, token contract, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # ADMIN-002. Roughly twenty design tokens were referenced but never defined,
      # so the guarantees page's primary action rendered as unstyled text and
      # every section heading on ten pages rendered at browser-default size.
      # Nothing caught it: a missing custom property is not a build error, and
      # there was no `next build` in CI and no visual test. The token contract in
      # `src/design-tokens.test.ts` is the gate, and it has to run before the
      # build - a build would happily emit a page whose colours resolve to
      # nothing.
      - name: Design token contract
        run: npm test

      # `next build` runs TypeScript over every page and Server Action, so it
      # catches a broken import or a prop mismatch that the unit tests mock away.
      - name: Build
        run: npm run build

  e2e:
    name: E2E (admin journeys)
    runs-on: ubuntu-latest

    # TEST-001. There was no e2e job at all, which is why the three specs in
    # `e2e/tests` - each of which navigated to `about:blank`, wrote its own
    # `<h1>`, and asserted it - had never been executed by anything. They would
    # have passed with the entire application deleted.
    #
    # These journeys drive the real admin app (`webServer` in playwright.config.ts
    # starts `next dev`) against a stub of the API it depends on. The stub is
    # needed because the session is read in a React Server Component, so the
    # request never passes through the browser and cannot be intercepted per-page.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck the journeys
        working-directory: e2e
        run: npm run typecheck

      # The guard that stops the old failure coming back: a spec that asserts
      # against markup it wrote itself is not a test, and this is the only place
      # that can be checked mechanically.
      - name: Spec guard
        working-directory: e2e
        run: npm run check:specs

      - name: Run journeys
        working-directory: e2e
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: reports/screenshots
          retention-days: 7

  secrets:
    name: Secrets (deterministic scan + self-test)
    runs-on: ubuntu-latest

    # SEC-005. A live Hugging Face token, a live OpenRouteService key and the
    # Postgres superuser password sat in plaintext in the working tree. `.env` is
    # correctly git-ignored and the history is clean, so the exposure was
    # on-disk rather than committed - but the repository also carries committed
    # debug artefacts, and any whole-tree archive a developer sends for
    # debugging would carry the files with it.
    #
    # `scripts/scan-secrets.mjs` rather than gitleaks. The reason is written into
    # that script: neither gitleaks nor trufflehog is installed here, so a gate
    # built on one could not be executed against this repository before being
    # merged - and a gate that has never been run is exactly the failure this
    # whole branch exists to close. That script is deterministic, has no
    # dependencies, and has been run.
    #
    # The self-test runs first and is the important half. A scanner that reports
    # "clean" is indistinguishable from one that stopped looking, so each rule is
    # fed a synthetic secret and asserted to fire before the real scan is trusted.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove the secret scanner still detects what it claims to
        run: node scripts/scan-secrets.mjs --self-test

      - name: Scan the working tree and history
        run: node scripts/scan-secrets.mjs

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Installs the Flutter SDK named by the `flutter-version` below. Without
      # this the 389 mobile tests only ever ran on one machine, so a change that
      # broke the app would not be caught until after merge.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub
