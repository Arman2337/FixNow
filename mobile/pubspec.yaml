name: fixnow_mobile
description: FixNow customer and provider mobile application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  audioplayers: 6.1.0
  file_picker: 11.0.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_secure_storage: 10.0.0
  geocoding: ^5.0.0
  geolocator: 14.0.2
  http: 1.6.0
  http_parser: 4.1.2
  image_picker: ^1.1.2
  intl: ^0.20.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  permission_handler: 11.4.0
  record: ^5.2.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  geolocator_platform_interface: 4.3.0
  plugin_platform_interface: 2.1.8

dependency_overrides:
  firebase_core_web: 3.10.0
  record_linux: 1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/services/

  # ---------------------------------------------------------------------------
  # Bundled brand font — Inter (SIL Open Font License 1.1).
  #
  # Inter ships as a real asset so typography renders identically on first
  # paint, on slow networks and offline. The app previously fetched Manrope
  # at runtime via google_fonts, so text fell back to the system face until
  # (and unless) the network fetch resolved, then shifted mid-session.
  #
  # Weights match app_typography.dart: 400 body, 500 emphasis, 600 labels
  # and buttons, 700 headings and prices. The license sits beside the files
  # as Inter-LICENSE.txt.
  # ---------------------------------------------------------------------------
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
